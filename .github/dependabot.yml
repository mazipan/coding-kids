version: 2
updates:
  - package-ecosystem: "npm" # bun projects use the npm ecosystem in Dependabot
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
