name: Build and Deploy to Netlify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: 'package.json'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set commit SHA
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          else
            COMMIT_SHA="${GITHUB_SHA}"
          fi
          echo "HEAD_SHA=${COMMIT_SHA}" >> $GITHUB_ENV
          echo "SHORT_SHA=${COMMIT_SHA::7}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Get commit title
        run: echo "COMMIT_TITLE=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

      - name: Build site
        run: bun run build

      - name: Deploy to Netlify
        id: netlify
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RESULT=$(bunx netlify-cli deploy --prod --dir=./dist \
              --message="Deploy from GitHub Actions (${{ env.SHORT_SHA }})" --json)
          else
            RESULT=$(bunx netlify-cli deploy --dir=./dist \
              --alias="preview-${{ github.event.pull_request.number }}" \
              --message="Deploy from GitHub Actions (${{ env.SHORT_SHA }})" --json)
          fi
          echo "deploy_url=$(echo $RESULT | jq -r '.deploy_url')" >> $GITHUB_OUTPUT
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment deploy URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const marker = '<!-- netlify-preview-comment -->';
            const deployUrl = '${{ steps.netlify.outputs.deploy_url }}';
            const sha = '${{ env.HEAD_SHA }}';
            const shortSha = '${{ env.SHORT_SHA }}';
            const commitTitle = '${{ env.COMMIT_TITLE }}';
            const deployedAt = new Date().toUTCString();
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const body = [
              marker,
              `## 🚀 Netlify Preview Deployment`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Preview URL** | ${deployUrl} |`,
              `| **Branch** | \`${{ github.head_ref }}\` |`,
              `| **Triggered by** | @${{ github.actor }} |`,
              `| **Commit** | [\`${shortSha}\`](${commitUrl}) |`,
              `| **Commit title** | ${commitTitle} |`,
              `| **Deployed at** | ${deployedAt} |`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
