name: Deploy Fork PR Preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy preview for'
        required: true
        type: number

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.inputs.pr_number }},
            })
            if (pr.state !== 'open') {
              core.setFailed(`PR #${{ github.event.inputs.pr_number }} is not open (state: ${pr.state})`)
              return
            }
            core.setOutput('head_sha', pr.head.sha)
            core.setOutput('short_sha', pr.head.sha.slice(0, 7))
            core.setOutput('fork_repo', pr.head.repo.full_name)
            core.setOutput('head_ref', pr.head.ref)
            core.setOutput('title', pr.title)
            core.setOutput('actor', pr.user.login)

      - name: Checkout fork branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76400c181273ba90b1 # v4
        with:
          repository: ${{ steps.pr.outputs.fork_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Copy branch to this repo
        run: |
          git remote add upstream https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push upstream HEAD:refs/heads/fork-preview/pr-${{ github.event.inputs.pr_number }} --force

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: 'package.json'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Deploy to Netlify
        id: netlify
        run: |
          RESULT=$(bunx netlify-cli deploy --dir=./dist \
            --alias="preview-${{ github.event.inputs.pr_number }}" \
            --message="Fork PR #${{ github.event.inputs.pr_number }} preview (${{ steps.pr.outputs.short_sha }})" \
            --json)
          echo "deploy_url=$(echo $RESULT | jq -r '.deploy_url')" >> $GITHUB_OUTPUT
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const marker = '<!-- netlify-preview-comment -->';
            const deployUrl = '${{ steps.netlify.outputs.deploy_url }}';
            const sha = '${{ steps.pr.outputs.head_sha }}';
            const shortSha = '${{ steps.pr.outputs.short_sha }}';
            const commitTitle = '${{ steps.pr.outputs.title }}';
            const actor = '${{ steps.pr.outputs.actor }}';
            const deployedAt = new Date().toUTCString();
            const commitUrl = `https://github.com/${{ steps.pr.outputs.fork_repo }}/commit/${sha}`;
            const body = [
              marker,
              `## 🚀 Netlify Preview Deployment`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Preview URL** | ${deployUrl} |`,
              `| **Branch** | \`${{ steps.pr.outputs.head_ref }}\` |`,
              `| **Triggered by** | @${{ github.actor }} |`,
              `| **PR author** | @${actor} |`,
              `| **Commit** | [\`${shortSha}\`](${commitUrl}) |`,
              `| **Commit title** | ${commitTitle} |`,
              `| **Deployed at** | ${deployedAt} |`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: ${{ github.event.inputs.pr_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: ${{ github.event.inputs.pr_number }},
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
