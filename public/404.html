<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — CodeKids</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#7C3AED" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        background: #0a0618;
        background-image:
          radial-gradient(circle at 25% 20%, rgba(124, 58, 237, 0.16), transparent 45%),
          radial-gradient(circle at 75% 80%, rgba(236, 72, 153, 0.12), transparent 45%);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #ffffff;
        text-align: center;
      }
      .card {
        max-width: 420px;
      }
      .emoji {
        font-size: 64px;
        line-height: 1;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 28px;
        font-weight: 900;
        margin-bottom: 12px;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 28px;
      }
      a.home-btn {
        display: inline-block;
        padding: 14px 32px;
        border-radius: 9999px;
        background: linear-gradient(135deg, #7c3aed, #ec4899);
        color: #ffffff;
        font-weight: 800;
        font-size: 16px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">🧭</div>
      <h1>Page Not Found</h1>
      <p>This page doesn't exist — maybe it moved, or the link was mistyped.</p>
      <a class="home-btn" href="/">Back to Home</a>
    </div>
  </body>
</html>
