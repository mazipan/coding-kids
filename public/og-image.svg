<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0618"/>
      <stop offset="100%" stop-color="#1C1440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <!-- objectBoundingBox (default) so the gradient fills the element itself, not the SVG origin -->
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#8B5CF6" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="200" cy="315" r="220" fill="#7C3AED" opacity="0.12"/>
  <circle cx="1000" cy="315" r="200" fill="#EC4899" opacity="0.10"/>

  <!-- Logo icon -->
  <rect x="80" y="140" width="80" height="80" rx="18" fill="url(#logoGrad)"/>
  <!-- fill="none" required — SVG paths default to fill:black which bleeds over the gradient -->
  <path d="M108 160L96 180L108 200" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 160L144 180L132 200" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M127 155L113 205" fill="none" stroke="#E9D5FF" stroke-width="4" stroke-linecap="round"/>

  <!-- App name -->
  <text x="180" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="white" letter-spacing="-2">CodeKids</text>

  <!-- Tagline -->
  <text x="80" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#A78BFA">Learn to Code &amp; Train Your Brain!</text>

  <!-- Divider -->
  <rect x="80" y="315" width="160" height="4" rx="2" fill="url(#accent)"/>

  <!-- Feature pills — 20px gaps between each -->
  <!-- Block Coding: x=80..275 -->
  <rect x="80" y="340" width="195" height="44" rx="22" fill="#7C3AED" opacity="0.3"/>
  <text x="178" y="368" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#C4B5FD" text-anchor="middle">&#x1F3AE; Block Coding</text>

  <!-- Brain Training: x=295..510, 20px gap -->
  <rect x="295" y="340" width="215" height="44" rx="22" fill="#EC4899" opacity="0.25"/>
  <text x="403" y="368" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FBCFE8" text-anchor="middle">&#x1F9E0; Brain Training</text>

  <!-- XP & Levels: x=530..720, 20px gap -->
  <rect x="530" y="340" width="190" height="44" rx="22" fill="#7C3AED" opacity="0.3"/>
  <text x="625" y="368" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#C4B5FD" text-anchor="middle">&#x1F3C6; XP &amp; Levels</text>

  <!-- 100% Free: x=740..900, 20px gap -->
  <rect x="740" y="340" width="160" height="44" rx="22" fill="#7C3AED" opacity="0.3"/>
  <text x="820" y="368" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#C4B5FD" text-anchor="middle">&#x2705; 100% Free</text>

  <!-- Ages + no-login: two pills, y=415..459, 20px gap between them -->
  <rect x="80" y="415" width="155" height="44" rx="22" fill="#1C1440" stroke="#7C3AED" stroke-width="1.5" opacity="0.9"/>
  <text x="158" y="443" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#A78BFA" text-anchor="middle">Ages 5&#x2013;14</text>

  <rect x="255" y="415" width="210" height="44" rx="22" fill="#1C1440" stroke="#7C3AED" stroke-width="1.5" opacity="0.9"/>
  <text x="360" y="443" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#A78BFA" text-anchor="middle">No Login Needed</text>

  <!-- Domain: baseline y=540, lighter purple for contrast, 81px gap from badge bottom -->
  <text x="80" y="540" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#8B5CF6">coding.mazipan.space</text>

  <!-- Right side decorative blocks -->
  <g transform="translate(940, 130)">
    <rect width="190" height="52" rx="10" fill="#7C3AED" opacity="0.5"/>
    <rect x="12" y="14" width="24" height="24" rx="6" fill="#C4B5FD"/>
    <rect x="48" y="20" width="110" height="12" rx="6" fill="#E9D5FF"/>
  </g>
  <g transform="translate(970, 205)">
    <rect width="190" height="52" rx="10" fill="#EC4899" opacity="0.4"/>
    <rect x="12" y="14" width="24" height="24" rx="6" fill="#FBCFE8"/>
    <rect x="48" y="20" width="90" height="12" rx="6" fill="#FCE7F3"/>
  </g>
  <g transform="translate(940, 280)">
    <rect width="190" height="52" rx="10" fill="#7C3AED" opacity="0.5"/>
    <rect x="12" y="14" width="24" height="24" rx="6" fill="#C4B5FD"/>
    <rect x="48" y="20" width="130" height="12" rx="6" fill="#E9D5FF"/>
  </g>
  <g transform="translate(970, 355)">
    <rect width="190" height="52" rx="10" fill="#EC4899" opacity="0.4"/>
    <rect x="12" y="14" width="24" height="24" rx="6" fill="#FBCFE8"/>
    <rect x="48" y="20" width="100" height="12" rx="6" fill="#FCE7F3"/>
  </g>
  <g transform="translate(940, 430)">
    <rect width="190" height="52" rx="10" fill="#7C3AED" opacity="0.35"/>
    <rect x="12" y="14" width="24" height="24" rx="6" fill="#C4B5FD"/>
    <rect x="48" y="20" width="80" height="12" rx="6" fill="#E9D5FF"/>
  </g>
</svg>
