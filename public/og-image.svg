<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0618"/>
      <stop offset="100%" stop-color="#1C1440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#8B5CF6" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="200" cy="315" r="200" fill="#7C3AED" opacity="0.12"/>
  <circle cx="1000" cy="315" r="180" fill="#EC4899" opacity="0.10"/>

  <!-- Logo icon -->
  <rect x="80" y="215" width="80" height="80" rx="18" fill="url(#logoGrad)"/>
  <path d="M108 235L96 255L108 275" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 235L144 255L132 275" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M127 230L113 280" stroke="#E9D5FF" stroke-width="4" stroke-linecap="round"/>

  <!-- App name -->
  <text x="180" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="white" letter-spacing="-2">CodeKids</text>

  <!-- Tagline -->
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#A78BFA">Where Kids Become Coders</text>

  <!-- Divider -->
  <rect x="80" y="375" width="160" height="4" rx="2" fill="url(#accent)"/>

  <!-- Feature pills -->
  <rect x="80" y="405" width="220" height="44" rx="22" fill="#7C3AED" opacity="0.3"/>
  <text x="190" y="433" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#C4B5FD" text-anchor="middle">🎮 Visual Blocks</text>

  <rect x="316" y="405" width="180" height="44" rx="22" fill="#7C3AED" opacity="0.3"/>
  <text x="406" y="433" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#C4B5FD" text-anchor="middle">🏆 XP &amp; Levels</text>

  <rect x="512" y="405" width="200" height="44" rx="22" fill="#7C3AED" opacity="0.3"/>
  <text x="612" y="433" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#C4B5FD" text-anchor="middle">🌍 6 Epic Worlds</text>

  <rect x="728" y="405" width="160" height="44" rx="22" fill="#7C3AED" opacity="0.3"/>
  <text x="808" y="433" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#C4B5FD" text-anchor="middle">✅ 100% Free</text>

  <!-- Domain -->
  <text x="80" y="555" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#6D28D9">coding.mazipan.space</text>

  <!-- Right side decorative blocks -->
  <g transform="translate(950, 160)">
    <rect width="180" height="52" rx="10" fill="#7C3AED" opacity="0.5"/>
    <rect x="12" y="14" width="24" height="24" rx="6" fill="#C4B5FD"/>
    <rect x="48" y="20" width="100" height="12" rx="6" fill="#E9D5FF"/>
  </g>
  <g transform="translate(980, 230)">
    <rect width="180" height="52" rx="10" fill="#EC4899" opacity="0.4"/>
    <rect x="12" y="14" width="24" height="24" rx="6" fill="#FBCFE8"/>
    <rect x="48" y="20" width="80" height="12" rx="6" fill="#FCE7F3"/>
  </g>
  <g transform="translate(950, 300)">
    <rect width="180" height="52" rx="10" fill="#7C3AED" opacity="0.5"/>
    <rect x="12" y="14" width="24" height="24" rx="6" fill="#C4B5FD"/>
    <rect x="48" y="20" width="120" height="12" rx="6" fill="#E9D5FF"/>
  </g>
  <g transform="translate(980, 370)">
    <rect width="180" height="52" rx="10" fill="#EC4899" opacity="0.4"/>
    <rect x="12" y="14" width="24" height="24" rx="6" fill="#FBCFE8"/>
    <rect x="48" y="20" width="90" height="12" rx="6" fill="#FCE7F3"/>
  </g>

  <!-- Ages badge -->
  <rect x="80" y="470" width="260" height="44" rx="22" fill="#1C1440" stroke="#7C3AED" stroke-width="1.5" opacity="0.8"/>
  <text x="210" y="498" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#A78BFA" text-anchor="middle">For Ages 5–14 · No Login Needed</text>
</svg>
